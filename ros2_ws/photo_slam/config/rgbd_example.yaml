# Example configuration for RGB-D SLAM with RealSense camera
rgbd_slam_node:
  ros__parameters:
    # Required paths - MUST be set for your system
    vocabulary_path: "/path/to/ORB-SLAM3/Vocabulary/ORBvoc.txt"
    orb_slam_config_path: "/path/to/Photo-SLAM/cfg/ORB_SLAM3/RGB-D/RealCamera/realsense_d455_rgbd.yaml"
    gaussian_config_path: "/path/to/Photo-SLAM/cfg/gaussian_mapper/RGB-D/RealCamera/realsense_rgbd.yaml"
    
    # Output directory for results
    output_directory: "/tmp/photo_slam_output"
    
    # Topic configuration for RealSense D455
    rgb_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    
    # Frame IDs
    map_frame_id: "map"
    camera_frame_id: "camera_link"
    
    # Feature flags
    use_viewer: false
    publish_tf: true
    publish_pose: true
    publish_path: true
    publish_odom: false
    
    # Queue size for message synchronization
    queue_size: 10