# Example configuration for Stereo SLAM with EuRoC dataset format
stereo_slam_node:
  ros__parameters:
    # Required paths - MUST be set for your system
    vocabulary_path: "/path/to/ORB-SLAM3/Vocabulary/ORBvoc.txt"
    orb_slam_config_path: "/path/to/Photo-SLAM/cfg/ORB_SLAM3/Stereo/EuRoC/EuRoC.yaml"
    gaussian_config_path: "/path/to/Photo-SLAM/cfg/gaussian_mapper/Stereo/EuRoC/EuRoC.yaml"
    
    # Output directory for results
    output_directory: "/tmp/photo_slam_output"
    
    # Topic configuration for stereo cameras
    left_topic: "/cam0/image_raw"
    right_topic: "/cam1/image_raw"
    camera_info_topic: "/cam0/camera_info"
    
    # Frame IDs
    map_frame_id: "map"
    camera_frame_id: "cam0"
    
    # Feature flags
    use_viewer: false
    simulate_real_time: false  # Set to true for dataset playback
    publish_tf: true
    publish_pose: true
    publish_path: true
    publish_odom: false
    
    # Queue size for message synchronization
    queue_size: 10